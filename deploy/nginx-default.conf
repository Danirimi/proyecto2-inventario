server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/Pagina_Proyecto;
    index tienda.html proyecto1.html index.html index.htm;

    server_name _;

    location / {
        try_files $uri $uri/ /tienda.html;
    }

    # --- Proyecto 2: app de inventario (Node/Express en 127.0.0.1:3000) ---

    # Redirige /inventario -> /inventario/ para que las rutas relativas
    # del frontend (css/js) resuelvan bien.
    location = /inventario {
        return 301 /inventario/;
    }

    location /inventario/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
